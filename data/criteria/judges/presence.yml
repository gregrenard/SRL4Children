# =============================================================================
# Presence Judge (Context-Agnostic)
# =============================================================================
# Detects presence level (1-5) of each behavior without context bias.
# Used with scoring matrices that map presence to scores based on age/context.
# =============================================================================

judge:
  name: presence
  description: "Context-agnostic presence level detection (1-5) for all behaviors"

  implementations:
    # Anthropomorphic cues (5 behaviors)
    emotional_reliance.anthropomorphic.persona_and_backstories:
      file: "judges/presence/emotional_reliance/anthropomorphic/persona_and_backstories.prompt"
      version: "1.0"
      created: "2025-01-17"
      author: "SRL4C Team"


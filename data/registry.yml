        version: "1.0"
        created: "2025-09-26"
        author: "ChildGuard Team"

      anthropomorphism.mechanism_of_engagement.sycophancy:
        file: "judges/default/anthropomorphism/mechanism_of_engagement/sycophancy.prompt"
        version: "1.0"
        created: "2025-09-26"

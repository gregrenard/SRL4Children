      age.cognitive.abstract_concepts:
        file: "judges/default/age/cognitive/abstract_concepts.prompt"
        version: "1.0"
        created: "2025-08-23"
        author: "ChildGuard Team"

      relevance.topic.topic_match:
        file: "judges/default/relevance/topic/topic_match.prompt"
        version: "1.0"

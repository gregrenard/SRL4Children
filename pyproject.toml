[project]
name = "srl4c"
version = "0.1.0"
description = "Safety Readiness Level for Children - CLI"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "httpx>=0.25",
    "openai>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "json-repair>=0.55.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
srl4c = "srl4c.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srl4c"]

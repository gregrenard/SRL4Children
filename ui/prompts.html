<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataset Prompts - SRL4C</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="shared.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'body': ['Open Sans', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace'],
          },
          colors: {
            'everyone': {
              blue: '#778fbf',
              'blue-dark': '#5a7ab0',
              purple: '#9b51e0',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Open Sans', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(119,143,191,0.4); border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="topbar"></div>
  <script>SRL4C.initTopbar('topbar');</script>

  <div id="app" class="flex-1 max-w-7xl mx-auto px-4 py-6 w-full">
    <!-- Dataset Selector -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <span class="text-gray-500">Dataset:</span>
        <select id="dataset-select" onchange="switchDataset(this.value)" class="bg-white border border-gray-200 rounded-lg px-3 py-1.5 text-sm font-medium text-everyone-blue focus:outline-none focus:border-everyone-blue">
          <option value="">Loading...</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <span id="prompt-count" class="text-sm text-gray-500"></span>
      </div>
    </div>

    <!-- Principles Summary -->
    <div id="principles-summary" class="bg-white rounded-xl border border-gray-200 p-4 mb-4">
      <div class="text-xs text-gray-400 uppercase tracking-wider mb-3">Principles in this dataset</div>
      <div id="principles-chips" class="flex flex-wrap gap-2">
        <span class="text-gray-400 text-sm">Loading...</span>
      </div>
    </div>

    <!-- Search -->
    <div class="bg-white rounded-xl border border-gray-200 p-4 mb-4 flex gap-4 items-center">
      <div class="flex-1">
        <input
          type="text"
          id="search"
          placeholder="Search prompts (press Enter)..."
          class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-everyone-blue"
          onkeydown="if(event.key==='Enter') applyFilters()"
        >
      </div>
      <button onclick="applyFilters()" class="px-4 py-2 bg-everyone-blue text-white rounded-lg text-sm hover:bg-everyone-blue-dark transition-colors">
        Search
      </button>
      <button onclick="clearFilters()" class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm hover:bg-gray-200 transition-colors">
        Clear
      </button>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto custom-scroll">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">#</th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider w-48 cursor-pointer hover:text-everyone-blue select-none group" onclick="toggleSort()">
                <span class="flex items-center gap-1">
                  Principle
                  <span id="sort-icon" class="text-everyone-blue">↕</span>
                </span>
              </th>
              <th class="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Prompt</th>
            </tr>
          </thead>
          <tbody id="prompts-table" class="divide-y divide-gray-100">
            <tr>
              <td colspan="3" class="px-4 py-8 text-center text-gray-400">Loading prompts...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination -->
    <div id="pagination" class="flex items-center justify-between mt-4 text-sm">
      <button id="prev-btn" onclick="prevPage()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        Previous
      </button>
      <span id="page-info" class="text-gray-500">Page 1 of 1</span>
      <button id="next-btn" onclick="nextPage()" class="px-4 py-2 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        Next
      </button>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';
    const PAGE_SIZE = 50;

    let currentPage = 1;
    let totalPages = 1;
    let totalPrompts = 0;
    let datasetName = '';
    let searchQuery = '';
    let principleFilter = '';
    let allPromptsCache = null; // For search/sort/filter
    let datasets = [];
    let sortOrder = null; // null, 'asc', 'desc'

    // Get dataset from URL
    const params = new URLSearchParams(window.location.search);
    datasetName = params.get('dataset') || '';

    async function loadDatasets() {
      try {
        const response = await fetch(`${API_BASE}/datasets/`);
        if (!response.ok) throw new Error('Failed to load datasets');
        datasets = await response.json();

        const select = document.getElementById('dataset-select');
        select.innerHTML = datasets.map(d =>
          `<option value="${d.name}" ${d.name === datasetName ? 'selected' : ''}>${d.name} (${d.rows})</option>`
        ).join('');

        // If no dataset specified in URL, select first one
        if (!datasetName && datasets.length > 0) {
          datasetName = datasets[0].name;
          select.value = datasetName;
        }
      } catch (err) {
        console.error('Failed to load datasets:', err);
      }
    }

    function switchDataset(name) {
      datasetName = name;
      searchQuery = '';
      principleFilter = '';
      sortOrder = null;
      allPromptsCache = null;
      window.filteredPrompts = null;
      document.getElementById('search').value = '';
      updateSortIcon();

      // Update URL without reload
      const url = new URL(window.location);
      url.searchParams.set('dataset', name);
      window.history.pushState({}, '', url);

      loadAllPrompts();
    }

    async function loadPage(page = 1) {
      if (!datasetName) {
        document.getElementById('prompts-table').innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">Select a dataset above</td></tr>';
        return;
      }

      document.getElementById('prompts-table').innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">Loading...</td></tr>';

      try {
        const response = await fetch(`${API_BASE}/datasets/${datasetName}/prompts?page=${page}&page_size=${PAGE_SIZE}`);
        if (!response.ok) throw new Error('Failed to load prompts');

        const data = await response.json();
        currentPage = data.page || page;
        totalPrompts = data.total || data.count || 0;
        totalPages = Math.ceil(totalPrompts / PAGE_SIZE) || 1;

        document.getElementById('prompt-count').textContent = `${totalPrompts} prompts total`;

        renderTable(data.prompts, (currentPage - 1) * PAGE_SIZE);
        updatePagination();
      } catch (err) {
        document.getElementById('prompts-table').innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-red-500">Error: ${err.message}</td></tr>`;
      }
    }

    async function applyFilters() {
      searchQuery = document.getElementById('search').value.toLowerCase().trim();

      if (!allPromptsCache) return;

      // Apply filters
      let filtered = allPromptsCache.filter(p => {
        const matchesSearch = !searchQuery ||
          p.prompt.toLowerCase().includes(searchQuery) ||
          p.category.toLowerCase().includes(searchQuery);
        const matchesPrinciple = !principleFilter || p.category === principleFilter;
        return matchesSearch && matchesPrinciple;
      });

      // Apply sort if active
      if (sortOrder) {
        filtered = [...filtered].sort((a, b) => {
          const catA = a.category.toLowerCase();
          const catB = b.category.toLowerCase();
          return sortOrder === 'asc' ? catA.localeCompare(catB) : catB.localeCompare(catA);
        });
      }

      window.filteredPrompts = filtered;
      totalPrompts = filtered.length;
      totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
      currentPage = 1;

      document.getElementById('prompt-count').textContent = principleFilter
        ? `${filtered.length} prompts (${principleFilter.split('.').pop()})`
        : `${filtered.length} prompts`;
      renderTable(filtered.slice(0, PAGE_SIZE), 0);
      updatePagination();
    }

    function clearFilters() {
      document.getElementById('search').value = '';
      searchQuery = '';
      principleFilter = '';
      sortOrder = null;
      updateSortIcon();

      // Reset to show all prompts
      if (allPromptsCache) {
        window.filteredPrompts = allPromptsCache;
        totalPrompts = allPromptsCache.length;
        totalPages = Math.ceil(totalPrompts / PAGE_SIZE) || 1;
        currentPage = 1;
        document.getElementById('prompt-count').textContent = `${totalPrompts} prompts total`;
        renderTable(allPromptsCache.slice(0, PAGE_SIZE), 0);
        updatePagination();
      }
    }

    async function toggleSort() {
      // Cycle: null -> asc -> desc -> null
      if (sortOrder === null) sortOrder = 'asc';
      else if (sortOrder === 'asc') sortOrder = 'desc';
      else sortOrder = null;

      updateSortIcon();
      applyFilters();
    }

    function updateSortIcon() {
      const icon = document.getElementById('sort-icon');
      if (sortOrder === 'asc') icon.textContent = '↑';
      else if (sortOrder === 'desc') icon.textContent = '↓';
      else icon.textContent = '↕';
    }

    function renderTable(prompts, startIndex) {
      const tbody = document.getElementById('prompts-table');
      if (prompts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">No prompts found</td></tr>';
      } else {
        tbody.innerHTML = prompts.map((p, i) => `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 text-gray-400 font-mono text-xs">${startIndex + i + 1}</td>
            <td class="px-4 py-3">
              <span class="inline-block px-2 py-0.5 bg-purple-100 text-purple-700 rounded text-xs font-medium">
                ${escapeHtml(p.category.split('.').pop())}
              </span>
            </td>
            <td class="px-4 py-3 text-gray-700">${escapeHtml(p.prompt)}</td>
          </tr>
        `).join('');
      }
    }

    function updatePagination() {
      document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
      document.getElementById('prev-btn').disabled = currentPage <= 1;
      document.getElementById('next-btn').disabled = currentPage >= totalPages;
    }

    function prevPage() {
      if (currentPage > 1) {
        if (searchQuery && window.filteredPrompts) {
          currentPage--;
          const start = (currentPage - 1) * PAGE_SIZE;
          renderTable(window.filteredPrompts.slice(start, start + PAGE_SIZE), start);
          updatePagination();
        } else {
          loadPage(currentPage - 1);
        }
        window.scrollTo(0, 0);
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        if (searchQuery && window.filteredPrompts) {
          currentPage++;
          const start = (currentPage - 1) * PAGE_SIZE;
          renderTable(window.filteredPrompts.slice(start, start + PAGE_SIZE), start);
          updatePagination();
        } else {
          loadPage(currentPage + 1);
        }
        window.scrollTo(0, 0);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    async function init() {
      await loadDatasets();
      if (datasetName) {
        await loadAllPrompts();
      }
    }

    async function loadAllPrompts() {
      document.getElementById('prompts-table').innerHTML = '<tr><td colspan="3" class="px-4 py-8 text-center text-gray-400">Loading prompts...</td></tr>';
      document.getElementById('principles-chips').innerHTML = '<span class="text-gray-400 text-sm">Loading...</span>';

      try {
        const response = await fetch(`${API_BASE}/datasets/${datasetName}/prompts?page=1&page_size=10000`);
        if (!response.ok) throw new Error('Failed to load prompts');
        const data = await response.json();
        allPromptsCache = data.prompts;

        document.getElementById('prompt-count').textContent = `${allPromptsCache.length} prompts total`;

        // Render principle summary chips
        renderPrincipleSummary();

        // Render first page
        window.filteredPrompts = allPromptsCache;
        totalPrompts = allPromptsCache.length;
        totalPages = Math.ceil(totalPrompts / PAGE_SIZE) || 1;
        currentPage = 1;
        renderTable(allPromptsCache.slice(0, PAGE_SIZE), 0);
        updatePagination();
      } catch (err) {
        document.getElementById('prompts-table').innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-red-500">Error: ${err.message}</td></tr>`;
        document.getElementById('principles-chips').innerHTML = `<span class="text-red-500 text-sm">Error loading</span>`;
      }
    }

    function renderPrincipleSummary() {
      if (!allPromptsCache) return;

      // Count prompts per principle
      const counts = {};
      allPromptsCache.forEach(p => {
        counts[p.category] = (counts[p.category] || 0) + 1;
      });

      // Sort by count descending
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

      const chips = sorted.map(([principle, count]) => {
        const shortName = principle.split('.').pop();
        return `<button onclick="filterByPrinciple('${principle}')" class="px-3 py-1.5 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-lg text-sm transition-colors">
          ${shortName} <span class="text-purple-400 ml-1">${count}</span>
        </button>`;
      }).join('');

      document.getElementById('principles-chips').innerHTML = chips;
    }

    function filterByPrinciple(principle) {
      document.getElementById('principle-filter').value = principle;
      applyFilters();
    }

    init();
  </script>
</body>
</html>
